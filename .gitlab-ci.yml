workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'

default:
  image: node:20-bookworm-slim
  tags:
    - saas-linux-small-amd64
  interruptible: true

.build:
  script:
    - npm ci
    - npm run build -- --env publicPath=/Boletas/
    - mv dist public

validate:
  extends: .build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pages:
  extends: .build
  pages:
    publish: public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
